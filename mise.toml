[tools]
go = "1.27.2"
golangci-lint = "2.14.0"
jq = "1.8.2"
"aqua:google/go-containerregistry" = "0.22.1"

# Space-separated list of module directories, kept in sync with the go.work
# use-list. "." is the base module; postgres is the engine sub-module and
# example the composition proof. The maintenance tasks below skip a
# directory without a go.mod; check, currency, and upgrade require one.
[env]
GO_MODULES = ". postgres example"
# The compose stack's defaults. The Azurite account and key are the
# emulator's published development credentials, not secrets.
BLOBFS_DSN = "postgres://app:app@127.0.0.1:5434/app?sslmode=disable"
BLOBFS_STORAGE_ENDPOINT = "http://127.0.0.1:10000/devstoreaccount1"
BLOBFS_STORAGE_ACCOUNT = "devstoreaccount1"
BLOBFS_STORAGE_KEY = "Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw=="
BLOBFS_STORAGE_CONTAINER = "blobfs"

# The one check: read-only and deterministic, stopping at the first failure.
[tasks.check]
description = "Build, vet, format, fix, tidy, test, and lint every module, then sqlint the repository; writes nothing"
run = '''
set -eu
export GOWORK=off
for mod in $GO_MODULES; do
  echo "check: $mod"
  cd "$MISE_PROJECT_ROOT/$mod"
  go build ./...
  go vet ./...
  unformatted=$(gofmt -l .)
  if [ -n "$unformatted" ]; then echo "gofmt: unformatted files:"; echo "$unformatted"; exit 1; fi
  go fix -diff ./...
  go mod tidy -diff
  go test -race ./...
  golangci-lint run ./...
done
# sqlint resolves the modules sqlint.toml names with go list -m, which the
# base module reaches only through the committed go.work, so it runs with
# the workspace on. go list -m does not download, so the engine is fetched
# first.
echo "check: sqlint"
cd "$MISE_PROJECT_ROOT"
env -u GOWORK go mod download github.com/standards-lab/sqlate/postgres
env -u GOWORK go run github.com/standards-lab/sqlate/sqlint/cmd/sqlint .
'''

# Currency: report what trails its latest, and the convenience that upgrades it.
[tasks.currency]
description = "Report every requirement, Go version, tool, action pin, and image tag behind its latest; writes nothing"
run = "scripts/currency.sh"

[tasks.upgrade]
description = "Upgrade every module's go directive and direct requirements and the local mise tools to their latest, rewriting go.mod and mise.toml"
run = '''
set -eu
export GOWORK=off
# The go directive follows the current Go minor, with no toolchain line.
go_minor=$(mise latest go | cut -d. -f1,2)
for mod in $GO_MODULES; do
  cd "$MISE_PROJECT_ROOT/$mod"
  go mod edit -go="$go_minor" -toolchain=none
  direct=$(go mod edit -json | jq -r '.Require[]? | select(.Indirect | not) | .Path')
  [ -z "$direct" ] || go get $(printf '%s@latest ' $direct)
  go mod tidy
done
cd "$MISE_PROJECT_ROOT"
mise upgrade --bump --local
'''

# Maintenance.
[tasks.tidy]
description = "Run go mod tidy across all modules"
run = '''
set -e
for mod in $GO_MODULES; do
  [ -f "$mod/go.mod" ] || continue
  echo "==> tidy: $mod"
  (cd "$mod" && go mod tidy)
done
'''

# Verification.
[tasks.fmt]
description = "Format all Go source"
run = "gofmt -w ."

[tasks.lint]
description = "Run golangci-lint across all modules, then sqlint over the repository"
run = '''
set -e
for mod in $GO_MODULES; do
  [ -f "$mod/go.mod" ] || continue
  echo "==> lint: $mod"
  (cd "$mod" && golangci-lint run ./...)
done
if [ -f sqlint.toml ]; then
  echo "==> sqlint"
  # The engine resolves through go list -m, which does not download.
  go mod download github.com/standards-lab/sqlate/postgres
  go run github.com/standards-lab/sqlate/sqlint/cmd/sqlint .
fi
'''

[tasks.build]
description = "Build each module with the workspace off, proving it resolves its own pins standalone"
run = '''
set -e
for mod in $GO_MODULES; do
  [ -f "$mod/go.mod" ] || continue
  echo "==> build (GOWORK=off): $mod"
  (cd "$mod" && GOWORK=off go build ./...)
done
'''

[tasks.vet]
description = "Run go vet across all modules"
run = '''
set -e
for mod in $GO_MODULES; do
  [ -f "$mod/go.mod" ] || continue
  echo "==> vet: $mod"
  (cd "$mod" && go vet ./...)
done
'''

# Testing.
[tasks.test]
description = "Run the unit tier across all modules"
run = '''
set -e
for mod in $GO_MODULES; do
  [ -f "$mod/go.mod" ] || continue
  echo "==> test: $mod"
  (cd "$mod" && go test -race ./...)
done
'''

[tasks.integration]
description = "Run the integration tier against the PostgreSQL named by BLOBFS_DSN"
run = "cd postgres && go test -race -tags integration -count=1 ./..."

[tasks.example]
description = "Run the composition proof against the compose PostgreSQL and Azurite"
run = "cd example && go run ."

[tasks.acceptance]
description = "The one-shot proof: up, integration, example, then reset regardless of the result, printing the stack's log on failure"
run = '''
set -e
trap 'rc=$?; [ $rc -eq 0 ] || docker compose logs; mise run reset; exit $rc' EXIT
mise run up
mise run integration
mise run example
'''

# Services: compose.yml's development stack, each service built from
# compose/<service>/Dockerfile, which pins its image and carries its health
# check. The named volumes keep the data across down; reset drops them.
[tasks.up]
description = "Build and start the compose PostgreSQL and Azurite and wait until they are healthy"
run = "docker compose up -d --wait --build"

[tasks.down]
description = "Stop the compose stack, keeping its volumes"
run = "docker compose down"

[tasks.reset]
description = "Stop the compose stack and drop its volumes"
run = "docker compose down -v"
